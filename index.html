<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="各個 bot 每天交來的連結都整理在這裡。">
  <meta name="robots" content="noindex">
  <title>每日連結總站</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="site.webmanifest">
  <meta name="apple-mobile-web-app-title" content="每日連結總站">
  <meta name="theme-color" content="#1a1815">
  <style>
    :root {
      color-scheme: light;
      --bg: #efe6d8;
      --fg: #1c1915;
      --muted: #6f655b;
      --paper: #fbf7f1;
      --line: #e3d5c2;
      --mast: #1a1815;
      --mast-fg: #f8f2e8;
      --mast-muted: #c9baa6;
      --gold: #e2b15a;
      --serif: "Iowan Old Style", Palatino, "Palatino Linotype", "Songti TC", "Noto Serif TC", "PMingLiU", serif;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #100f0d;
        --fg: #f4efe6;
        --muted: #b7ab9c;
        --paper: #1b1a17;
        --line: #34302a;
        --mast: #070706;
        --mast-fg: #f7f2ea;
        --mast-muted: #b7ab9c;
        --gold: #e2b15a;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      line-height: 1.5;
    }

    .svg-sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .masthead {
      background: var(--mast);
      color: var(--mast-fg);
      padding: 2.8rem 1.25rem 2.2rem;
    }

    .wrap {
      width: min(48rem, 100%);
      margin: 0 auto;
      padding: 0 1.2rem;
    }

    .kicker {
      margin: 0 0 0.7rem;
      color: var(--gold);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.24em;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(2.15rem, 6vw, 3.25rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.12;
    }

    .dek {
      max-width: 34rem;
      margin: 0.85rem 0 0;
      color: var(--mast-muted);
      font-size: 0.98rem;
    }

    main { padding: 1.25rem 0 4rem; }

    .key {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      list-style: none;
      margin: 0 0 1.15rem;
      padding: 0;
    }

    .chip,
    .block-head {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .key li { display: flex; }

    .chip {
      border-radius: 999px;
      padding: 0.22rem 0.72rem 0.22rem 0.22rem;
      background: var(--fill);
      color: var(--ink);
      font-size: 0.82rem;
      font-weight: 700;
    }

    a.chip,
    a.chip:visited {
      color: var(--ink);
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    a.chip:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    a.chip:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    .chip.is-disabled {
      opacity: 0.38;
      cursor: default;
    }

    .carry {
      margin-left: auto;
      padding: 0.12rem 0.5rem;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      color: var(--soft);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    @media (prefers-reduced-motion: reduce) {
      a.chip { transition: none; }
    }

    .mark {
      display: grid;
      place-items: center;
      flex: none;
      background: var(--mark);
      color: var(--mark-ink);
    }

    .mark svg {
      display: block;
      width: 1.15rem;
      height: 1.15rem;
    }

    .chip .mark {
      width: 1.7rem;
      height: 1.7rem;
      border-radius: 999px;
    }

    .chip .mark svg { width: 0.95rem; height: 0.95rem; }

    .day {
      display: grid;
      grid-template-columns: 6.4rem minmax(0, 1fr);
      gap: 0.85rem 1.05rem;
      margin: 0 0 1.15rem;
      padding: 1rem;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 1.35rem;
    }

    .day-mark { padding-top: 0.15rem; }

    .dow {
      display: block;
      font-family: var(--serif);
      font-size: 2.7rem;
      font-weight: 600;
      line-height: 0.85;
      letter-spacing: -0.04em;
    }

    .md {
      display: block;
      margin-top: 0.55rem;
      font-size: 0.95rem;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .year {
      display: block;
      margin-top: 0.1rem;
      color: var(--muted);
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
    }

    .blocks {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      min-width: 0;
    }

    .block {
      background: var(--fill);
      color: var(--ink);
      border-radius: 1rem;
      padding: 0.85rem 0.95rem 0.35rem;
    }

    .block-head { gap: 0.7rem; margin-bottom: 0.45rem; }

    .block .mark {
      width: 3rem;
      height: 3rem;
      border-radius: 0.85rem;
    }

    .block .mark svg { width: 1.6rem; height: 1.6rem; }

    .block h3 {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 750;
      letter-spacing: 0.12em;
    }

    .links {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .links a {
      display: block;
      min-height: 2.75rem;
      padding: 0.65rem 0.15rem 0.7rem;
      border-top: 1px solid var(--hairline);
      color: inherit;
      text-decoration: none;
    }

    .links a:hover .title { text-decoration: underline; text-underline-offset: 0.18em; }

    .links a:focus-visible {
      outline: 2px solid var(--mark);
      outline-offset: 2px;
      border-radius: 0.4rem;
    }

    .title {
      display: block;
      font-size: 1.02rem;
      font-weight: 680;
      overflow-wrap: anywhere;
    }

    .bot {
      display: block;
      margin-top: 0.12rem;
      color: var(--soft);
      font-size: 0.82rem;
      overflow-wrap: anywhere;
    }

    .cat-news {
      --fill: #dce8f8;
      --ink: #16345c;
      --soft: #4c6890;
      --mark: #1d4f92;
      --mark-ink: #f4f8fd;
      --hairline: rgba(29, 79, 146, 0.18);
    }

    .cat-insight {
      --fill: #f8ead0;
      --ink: #6a3d0c;
      --soft: #8d6233;
      --mark: #a15c12;
      --mark-ink: #fff8ee;
      --hairline: rgba(161, 92, 18, 0.2);
    }

    .cat-x {
      --fill: #141414;
      --ink: #f6f6f6;
      --soft: #c6c6c6;
      --mark: #f6f6f6;
      --mark-ink: #111111;
      --hairline: rgba(255, 255, 255, 0.16);
    }

    .cat-tech {
      --fill: #d9f1ea;
      --ink: #0d3f36;
      --soft: #3d6f64;
      --mark: #0e6b5c;
      --mark-ink: #f3fbf8;
      --hairline: rgba(14, 107, 92, 0.18);
    }

    .cat-learn {
      --fill: #e6e1f6;
      --ink: #2f2563;
      --soft: #61589a;
      --mark: #5240a8;
      --mark-ink: #f7f5fe;
      --hairline: rgba(82, 64, 168, 0.18);
    }

    .cat-expense {
      --fill: #f8e7ee;
      --ink: #5a2036;
      --soft: #7d4a5e;
      --mark: #9b2f55;
      --mark-ink: #fff6f8;
      --hairline: rgba(155, 47, 85, 0.2);
    }

    .cat-save {
      --fill: #e3f3f6;
      --ink: #0e3c48;
      --soft: #3d6b76;
      --mark: #0e7490;
      --mark-ink: #f3fbfd;
      --hairline: rgba(14, 116, 144, 0.2);
    }

    .cat-weekend {
      --fill: #fde3d4;
      --ink: #6e2e16;
      --soft: #945743;
      --mark: #d15a2c;
      --mark-ink: #fff7f3;
      --hairline: rgba(209, 90, 44, 0.2);
    }

    /* 今日提醒 is not a data.json category. Pine, so it does not collide with 記帳's rose. */
    .cat-remind {
      --fill: #e4efe6;
      --ink: #1b3a28;
      --soft: #3f6a50;
      --mark: #2f6b45;
      --mark-ink: #f3fbf6;
      --hairline: rgba(47, 107, 69, 0.18);
    }

    @media (prefers-color-scheme: dark) {
      .cat-news {
        --fill: #1a2c44;
        --ink: #e6eef9;
        --soft: #a9c0de;
        --mark: #8eb7ea;
        --mark-ink: #102033;
        --hairline: rgba(142, 183, 234, 0.28);
      }

      .cat-insight {
        --fill: #332616;
        --ink: #fbe7c6;
        --soft: #e2c59a;
        --mark: #f0c27a;
        --mark-ink: #2a1c0c;
        --hairline: rgba(240, 194, 122, 0.28);
      }

      .cat-x {
        --fill: #f3f3f3;
        --ink: #151515;
        --soft: #4e4e4e;
        --mark: #151515;
        --mark-ink: #f6f6f6;
        --hairline: rgba(0, 0, 0, 0.12);
      }

      .cat-tech {
        --fill: #132924;
        --ink: #def6ef;
        --soft: #a7d5c8;
        --mark: #8ed9c8;
        --mark-ink: #0d2420;
        --hairline: rgba(142, 217, 200, 0.28);
      }

      .cat-learn {
        --fill: #25203f;
        --ink: #e9e5fb;
        --soft: #bdb4e6;
        --mark: #b4a6f2;
        --mark-ink: #1c1736;
        --hairline: rgba(180, 166, 242, 0.28);
      }

      .cat-expense {
        --fill: #3a1c2a;
        --ink: #fde8f0;
        --soft: #e7b4c6;
        --mark: #f0a0c0;
        --mark-ink: #3a1828;
        --hairline: rgba(240, 160, 192, 0.3);
      }

      .cat-save {
        --fill: #143038;
        --ink: #dff6f8;
        --soft: #a9d4db;
        --mark: #7fd3e4;
        --mark-ink: #102428;
        --hairline: rgba(127, 211, 228, 0.3);
      }

      .cat-weekend {
        --fill: #3a2219;
        --ink: #ffe4d4;
        --soft: #f0c2ae;
        --mark: #ffb089;
        --mark-ink: #3a1c12;
        --hairline: rgba(255, 176, 137, 0.3);
      }

      .cat-remind {
        --fill: #1a2c22;
        --ink: #dff3e6;
        --soft: #a7d4b8;
        --mark: #8ed9b0;
        --mark-ink: #102016;
        --hairline: rgba(142, 217, 176, 0.28);
      }
    }

    details.history { margin-top: 0.4rem; }

    summary {
      display: flex;
      align-items: center;
      min-height: 2.9rem;
      padding: 0.7rem 1.05rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      font-weight: 750;
      cursor: pointer;
    }

    summary:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    details.history .day:first-of-type { margin-top: 1rem; }

    .status { color: var(--muted); }

    .gate { margin: 0 auto 1.25rem; max-width: 22rem; }
    .gate[hidden] { display: none; }
    .gate form {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 1.35rem;
      padding: 1.15rem;
    }
    .gate h2 {
      margin: 0 0 0.85rem;
      font-family: var(--serif);
      font-size: 1.35rem;
      font-weight: 600;
    }
    .gate label { display: block; margin-bottom: 0.4rem; font-size: 0.88rem; color: var(--muted); }
    .gate input {
      width: 100%;
      min-height: 2.75rem;
      padding: 0.55rem 0.75rem;
      border: 1px solid var(--line);
      border-radius: 0.7rem;
      background: var(--bg);
      color: var(--fg);
      font: inherit;
    }
    .gate button {
      width: 100%;
      min-height: 2.75rem;
      margin-top: 0.7rem;
      border: 0;
      border-radius: 999px;
      background: var(--mast);
      color: var(--mast-fg);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .gate button:disabled { opacity: 0.6; cursor: default; }
    .gate input:focus-visible,
    .gate button:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }
    .gate-error { margin: 0.7rem 0 0; color: #8d2f2f; min-height: 1.2em; }
    @media (prefers-color-scheme: dark) {
      .gate-error { color: #f0b4b4; }
    }

    #reminders:empty { display: none; }

    .reminders {
      margin: 0 0 1.15rem;
    }

    .reminders-headline {
      margin: 0.2rem 0 0;
      font-family: var(--serif);
      font-size: 1.28rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .reminders-sub {
      margin: 0.35rem 0 0;
      color: var(--soft);
      font-size: 0.9rem;
    }

    .reminders-updated {
      margin: 0.35rem 0 0;
      color: var(--soft);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
    }

    .reminders-section {
      margin: 0.7rem 0 0;
      padding: 0.55rem 0 0;
      border-top: 1px solid var(--hairline);
    }

    .reminders-section h4 {
      margin: 0 0 0.3rem;
      color: var(--soft);
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.12em;
    }

    .reminders-rows {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .reminders-rows.numbered { counter-reset: remind; }

    .reminders-rows li {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 0.32rem 0;
      overflow-wrap: anywhere;
    }

    .reminders-rows.numbered li { counter-increment: remind; }

    .reminders-dot {
      flex: none;
      width: 0.5rem;
      height: 0.5rem;
      margin-top: 0.55rem;
      border-radius: 999px;
      background: var(--mark);
    }

    .reminders-rows.numbered li::before {
      content: counter(remind);
      flex: none;
      width: 1.15rem;
      color: var(--soft);
      font-size: 0.78rem;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      line-height: 1.6;
      text-align: right;
    }

    .reminders-rows.numbered .reminders-dot { display: none; }

    .reminders-tag {
      flex: none;
      margin-top: 0.12rem;
      padding: 0.08rem 0.45rem;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      color: var(--soft);
      font-size: 0.72rem;
      font-weight: 700;
    }

    .reminders-rows .is-muted { color: var(--soft); }

    .reminders-notes {
      margin: 0.75rem 0 0.2rem;
      padding: 0.55rem 0 0;
      border-top: 1px solid var(--hairline);
      color: var(--soft);
      font-size: 0.86rem;
    }

    .reminders-notes p { margin: 0 0 0.28rem; }

    .reminders-pending {
      margin: 0.25rem 0 0.15rem;
      color: var(--soft);
    }

    .reminders.is-collapsed {
      display: block;
      margin: 0 0 1rem;
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 0;
    }

    .reminders.is-collapsed .day-mark,
    .reminders.is-collapsed .reminders-details {
      display: none;
    }

    .reminders-toggle {
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
      width: 100%;
      margin: 0;
      padding: 0.8rem 0.9rem;
      border: 0;
      border-radius: 1rem;
      background: var(--fill);
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .reminders.is-pending .reminders-toggle {
      cursor: default;
    }

    .reminders-toggle:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    .reminders-toggle .mark {
      width: 2.6rem;
      height: 2.6rem;
      border-radius: 0.75rem;
    }

    .reminders-toggle .mark svg {
      width: 1.35rem;
      height: 1.35rem;
    }

    .reminders-toggle-body {
      flex: 1;
      min-width: 0;
    }

    .reminders.is-collapsed .reminders-headline {
      margin: 0;
      font-size: 1.08rem;
    }

    .reminders.is-collapsed .reminders-sub {
      margin: 0.2rem 0 0;
    }

    .reminders.is-expanded .reminders-toggle .reminders-headline,
    .reminders.is-expanded .reminders-toggle .reminders-sub,
    .reminders.is-expanded .reminders-toggle .reminders-summary,
    .reminders.is-expanded .reminders-toggle .reminders-more {
      display: none;
    }

    .reminders.is-collapsed .reminders-kicker {
      display: none;
    }

    .reminders-kicker {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 750;
      letter-spacing: 0.12em;
    }

    .reminders-affordance {
      flex: none;
      margin-top: 0.2rem;
      color: var(--soft);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .reminders-summary {
      list-style: none;
      margin: 0.35rem 0 0;
      padding: 0;
    }

    .reminders-summary li {
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
      min-width: 0;
      padding: 0.08rem 0;
      font-size: 0.9rem;
    }

    .reminders-summary .reminders-dot {
      margin-top: 0;
      width: 0.4rem;
      height: 0.4rem;
    }

    .reminders-summary .reminders-item {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .reminders-more {
      margin: 0.15rem 0 0;
      color: var(--soft);
      font-size: 0.82rem;
    }

    .reminders.is-expanded .blocks {
      gap: 0;
      background: var(--fill);
      color: var(--ink);
      border-radius: 1rem;
    }

    .reminders.is-expanded .reminders-toggle {
      background: transparent;
      padding: 0.85rem 0.95rem 0.25rem;
    }

    .reminders.is-expanded .reminders-details {
      background: transparent;
      padding: 0.15rem 0.95rem 0.55rem;
    }

    .reminders a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 0.18em;
    }

    .reminders a:focus-visible {
      outline: 2px solid var(--mark);
      outline-offset: 2px;
      border-radius: 0.4rem;
    }

    @media (max-width: 640px) {
      .masthead { padding: 2.1rem 0 1.6rem; }

      .day {
        grid-template-columns: 1fr;
        gap: 0.75rem;
        padding: 0.85rem;
      }

      .day-mark {
        display: flex;
        align-items: baseline;
        gap: 0.65rem;
        padding-bottom: 0.45rem;
        border-bottom: 1px solid var(--line);
      }

      .dow { font-size: 1.85rem; }
      .md { margin-top: 0; }
      .year { margin-left: auto; }
    }
  </style>
</head>
<body>
  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-news" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M3.6 4.6h12.2c.7 0 1.2.5 1.2 1.2V19.2H6.2A2.6 2.6 0 0 1 3.6 16.6V4.6Z"/>
      <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6.2 7.6h7.6"/>
      <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M6.2 10.6h3.2M6.2 13h3.2M6.2 15.4h3.2M10.6 10.6h3.2M10.6 13h3.2M10.6 15.4h3.2"/>
      <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M17 7.4h2.6c.6 0 1.1.5 1.1 1.1v8.2a2.5 2.5 0 0 1-2.5 2.5"/>
    </symbol>
    <symbol id="icon-insight" viewBox="0 0 24 24">

  <header class="masthead">
    <div class="wrap">
      <p class="kicker">LINK DESK</p>
      <h1>每日連結總站</h1>
      <p class="dek">各個 bot 每天交來的連結都整理在這裡，最新的一天在最上面，依類別分組。</p>
    </div>
  </header>
  <main>
    <div class="wrap">
      <section id="gate" class="gate">
        <form id="gate-form">
          <h2>輸入密碼</h2>
          <label for="gate-password">密碼</label>
          <input id="gate-password" type="password" name="password" autocomplete="current-password" required>
          <button type="submit">進入</button>
          <p id="gate-error" class="gate-error" hidden>密碼不對</p>
        </form>
      </section>
      <div id="desk" hidden>
        <div id="reminders"></div>
        <ul class="key" id="key" hidden></ul>
        <div id="app" class="status">載入中…</div>
      </div>
    </div>
  </main>
  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";
    const CATEGORIES = [
      { name: "新聞", className: "cat-news", icon: "icon-news" },
      { name: "洞察", className: "cat-insight", icon: "icon-insight" },
      { name: "X", className: "cat-x", icon: "icon-x" },
      { name: "學習", className: "cat-learn", icon: "icon-learn" },
      { name: "記帳", className: "cat-expense", icon: "icon-expense" },
      { name: "省錢", className: "cat-save", icon: "icon-save" },
      { name: "週末", className: "cat-weekend", icon: "icon-weekend" }
    ];

    function icon(id) {
      const svg = document.createElementNS(SVG_NS, "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("aria-hidden", "true");
      svg.setAttribute("focusable", "false");
      const use = document.createElementNS(SVG_NS, "use");
      use.setAttribute("href", "#" + id);
      svg.appendChild(use);
      return svg;
    }

    function badge(id) {
      const mark = document.createElement("span");
      mark.className = "mark";
      mark.appendChild(icon(id));
      return mark;
    }

    function byDateDesc(a, b) {
      return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
    }

    function safeHref(href) {
      if (typeof href !== "string" || !href.trim()) return null;
      try {
        const url = new URL(href, window.location.href);
        if (url.protocol === "http:" || url.protocol === "https:") return url.href;
      } catch (error) {
        return null;
      }
      return null;
    }

    function dayParts(day) {
      const label = day.label || day.date || "";
      const match = /^(\d{4})-(\d{2})-(\d{2})（(.)）$/.exec(label);
      if (!match) return { dow: "", md: label, year: "" };
      return { dow: match[4], md: match[2] + "/" + match[3], year: match[1] };
    }

    function utcWeekday(iso) {
      const parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
      if (!parts) return null;
      return new Date(Date.UTC(Number(parts[1]), Number(parts[2]) - 1, Number(parts[3]))).getUTCDay();
    }

    function shiftDate(iso, days) {
      const parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
      const dt = new Date(Date.UTC(Number(parts[1]), Number(parts[2]) - 1, Number(parts[3])));
      dt.setUTCDate(dt.getUTCDate() + days);
      const month = String(dt.getUTCMonth() + 1).padStart(2, "0");
      const day = String(dt.getUTCDate()).padStart(2, "0");
      return dt.getUTCFullYear() + "-" + month + "-" + day;
    }

    function latestHref(data, categoryName) {
      const pools = [data.days || [], data.history || []];
      for (let i = 0; i < pools.length; i += 1) {
        const sorted = pools[i].slice().sort(byDateDesc);
        for (let j = 0; j < sorted.length; j += 1) {
          const item = (sorted[j].items || []).find((entry) => safeHref(entry.href) && entry.category === categoryName);
          if (!item) continue;
          return safeHref(item.href);
        }
      }
      return null;
    }

    function isoDate(year, month, day) {
      return year + "-" + String(month).padStart(2, "0") + "-" + String(day).padStart(2, "0");
    }

    function isRealDate(iso) {
      const parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
      if (!parts) return false;
      const dt = new Date(Date.UTC(Number(parts[1]), Number(parts[2]) - 1, Number(parts[3])));
      return dt.getUTCFullYear() === Number(parts[1])
        && dt.getUTCMonth() === Number(parts[2]) - 1
        && dt.getUTCDate() === Number(parts[3]);
    }

    function targetSaturday(item, arrivalDate) {
      const fromHref = String(item.href || "").match(/(\d{4}-\d{2}-\d{2})\.html/);
      if (fromHref && isRealDate(fromHref[1])) return fromHref[1];
      const fromTitle = String(item.title || "").match(/(\d{1,2})\s*[\/／]\s*(\d{1,2})/);
      if (!fromTitle) return null;
      const month = Number(fromTitle[1]);
      const day = Number(fromTitle[2]);
      let year = arrivalDate ? Number(String(arrivalDate).slice(0, 4)) : Number(taipeiToday().slice(0, 4));
      let iso = isoDate(year, month, day);
      if (!isRealDate(iso)) return null;
      if (arrivalDate && iso < arrivalDate) iso = isoDate(year + 1, month, day);
      return isRealDate(iso) ? iso : null;
    }

    function weekSaturday(iso) {
      const delta = { 4: 2, 5: 1, 6: 0, 0: -1 }[utcWeekday(iso)];
      if (delta === undefined) return null;
      return shiftDate(iso, delta);
    }

    function taipeiToday() {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Taipei",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date());
    }

    function currentWeekendSaturday(today) {
      const weekday = utcWeekday(today);
      if (weekday === 0) return shiftDate(today, -1);
      return shiftDate(today, 6 - weekday);
    }

    function weekendEntries(data) {
      const entries = [];
      (data.days || []).concat(data.history || []).forEach((day) => {
        (day.items || []).forEach((item) => {
          if (item.category !== "週末") return;
          entries.push({
            date: day.date || "",
            item: item,
            target: targetSaturday(item, day.date)
          });
        });
      });
      return entries;
    }

    function byArrivalDesc(a, b) {
      return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
    }

    // 四到日顯示「該週六」對應的週末推薦，取代當天為更晚週末交來的那一筆。
    function weekendForDay(day, entries) {
      const own = (day.items || []).filter((item) => item.category === "週末");
      const saturday = day.date ? weekSaturday(day.date) : null;
      if (!saturday) return { items: own, tagged: false };
      const matches = entries.filter((entry) => entry.target === saturday).sort(byArrivalDesc);
      if (!matches.length) return { items: [], tagged: false };
      return { items: [matches[0].item], tagged: true };
    }

    function weekendChipHref(data) {
      const entries = weekendEntries(data).filter((entry) => safeHref(entry.item.href));
      if (!entries.length) return null;
      const saturday = currentWeekendSaturday(taipeiToday());
      const exact = entries.filter((entry) => entry.target === saturday).sort(byArrivalDesc);
      if (exact.length) return safeHref(exact[0].item.href);
      const future = entries
        .filter((entry) => entry.target && entry.target > saturday)
        .sort((a, b) => (a.target < b.target ? -1 : a.target > b.target ? 1 : byArrivalDesc(a, b)));
      if (future.length) return safeHref(future[0].item.href);
      return safeHref(entries.slice().sort(byArrivalDesc)[0].item.href);
    }

    function renderLegend(data) {
      const list = document.getElementById("key");
      list.replaceChildren();
      CATEGORIES.forEach((category) => {
        const li = document.createElement("li");
        const href = category.name === "記帳"
          ? "https://penguin-yeh.github.io/expense-dashboard/"
          : category.name === "省錢"
            ? "https://penguin-yeh.github.io/savings/"
            : category.name === "週末" ? weekendChipHref(data) : latestHref(data, category.name);
        const chip = document.createElement(href ? "a" : "span");
        chip.className = "chip " + category.className + (href ? "" : " is-disabled");
        if (href) {
          chip.href = href;
          if (category.name !== "記帳" && category.name !== "省錢") chip.target = "_blank";
          chip.rel = "noopener noreferrer";
          const labels = { "記帳": "開啟消費儀表板", "省錢": "開啟省錢情報" };
          chip.setAttribute("aria-label", labels[category.name] || "開啟最新的" + category.name);
        } else {
          chip.setAttribute("aria-disabled", "true");
        }
        const name = document.createElement("span");
        name.textContent = category.name;
        chip.append(badge(category.icon), name);
        li.appendChild(chip);
        list.appendChild(li);
      });
      list.hidden = false;
    }

    function renderDay(day, sources) {
      const section = document.createElement("section");
      section.className = "day";

      const parts = dayParts(day);
      const mark = document.createElement("div");
      mark.className = "day-mark";
      if (parts.dow) {
        const dow = document.createElement("span");
        dow.className = "dow";
        dow.textContent = parts.dow;
        const md = document.createElement("span");
        md.className = "md";
        md.textContent = parts.md;
        const year = document.createElement("span");
        year.className = "year";
        year.textContent = parts.year;
        mark.append(dow, md, year);
      } else {
        mark.textContent = day.label || day.date || "";
      }
      section.appendChild(mark);

      const blocks = document.createElement("div");
      blocks.className = "blocks";

      CATEGORIES.forEach((category) => {
        if (category.name === "記帳" || category.name === "省錢") return;
        let items = (day.items || []).filter((item) => item.category === category.name);
        let carried = false;
        if (category.name === "週末") {
          const picked = weekendForDay(day, sources);
          items = picked.items;
          carried = picked.tagged;
        }
        if (!items.length) return;

        const block = document.createElement("section");
        block.className = "block " + category.className;

        const head = document.createElement("div");
        head.className = "block-head";
        const title = document.createElement("h3");
        title.textContent = category.name;
        head.append(badge(category.icon), title);
        if (carried) {
          const tag = document.createElement("span");
          tag.className = "carry";
          tag.textContent = "本週末";
          head.appendChild(tag);
        }
        block.appendChild(head);

        const list = document.createElement("ul");
        list.className = "links";
        items.forEach((item) => {
          const href = safeHref(item.href);
          if (!href) return;
          const li = document.createElement("li");
          const link = document.createElement("a");
          link.href = href;
          link.target = "_blank";
          link.rel = "noopener noreferrer";

          const name = document.createElement("span");
          name.className = "title";
          name.textContent = item.title || href;

          const bot = document.createElement("span");
          bot.className = "bot";
          bot.textContent = item.bot || "";

          link.append(name, bot);
          li.appendChild(link);
          list.appendChild(li);
        });

        if (!list.childElementCount) return;
        block.appendChild(list);
        blocks.appendChild(block);
      });

      if (!blocks.childElementCount) return null;
      section.appendChild(blocks);
      return section;
    }

    function renderDays(days, data) {
      const sources = weekendEntries(data);
      const fragment = document.createDocumentFragment();
      days.slice().sort(byDateDesc).forEach((day) => {
        const section = renderDay(day, sources);
        if (section) fragment.appendChild(section);
      });
      return fragment;
    }

    function showMessage(text) {
      const app = document.getElementById("app");
      app.className = "status";
      app.textContent = text;
    }

    function viewDate() {
      const override = new URLSearchParams(location.search).get("date");
      if (override && isRealDate(override)) return override;
      return taipeiToday();
    }

    function reminderDayParts(iso) {
      const parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
      if (!parts) return { dow: "今", md: "", year: "" };
      const weekday = utcWeekday(iso);
      const names = "日一二三四五六";
      return {
        dow: weekday === null ? "今" : names[weekday],
        md: parts[2] + "/" + parts[3],
        year: parts[1]
      };
    }

    function formatUpdatedAt(value) {
      if (!value) return "";
      const dt = new Date(value);
      if (Number.isNaN(dt.getTime())) return "";
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Taipei",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }).formatToParts(dt);
      const get = (type) => (parts.find((part) => part.type === type) || {}).value;
      return get("month") + "/" + get("day") + " " + get("hour") + ":" + get("minute");
    }

    function appendLinkedText(node, text) {
      const value = String(text || "");
      const pattern = /https?:\/\/[^\s)\]>，。、]+/gi;
      let last = 0;
      let match;
      while ((match = pattern.exec(value))) {
        if (match.index > last) node.appendChild(document.createTextNode(value.slice(last, match.index)));
        let href = match[0];
        let trailing = "";
        while (/[.,;:!?，。、）】」』]$/.test(href)) {
          trailing = href.slice(-1) + trailing;
          href = href.slice(0, -1);
        }
        const safe = safeHref(href);
        if (safe) {
          const link = document.createElement("a");
          link.href = safe;
          link.rel = "noopener noreferrer";
          link.textContent = href;
          node.appendChild(link);
        } else {
          node.appendChild(document.createTextNode(match[0]));
          trailing = "";
        }
        if (trailing) node.appendChild(document.createTextNode(trailing));
        last = match.index + match[0].length;
      }
      if (last < value.length) node.appendChild(document.createTextNode(value.slice(last)));
    }

    function renderReminderRows(section) {
      const numbered = section.style === "numbered";
      const list = document.createElement(numbered ? "ol" : "ul");
      list.className = "reminders-rows" + (numbered ? " numbered" : "");
      (section.rows || []).forEach((row) => {
        if (!row || !row.text) return;
        const item = document.createElement("li");
        if (row.muted) item.className = "is-muted";
        const dot = document.createElement("span");
        dot.className = "reminders-dot";
        if (row.color) dot.style.background = row.color;
        item.appendChild(dot);
        if (row.tag) {
          const tag = document.createElement("span");
          tag.className = "reminders-tag";
          tag.textContent = row.tag;
          item.appendChild(tag);
        }
        const body = document.createElement("span");
        appendLinkedText(body, row.text);
        item.appendChild(body);
        list.appendChild(item);
      });
      return list.childElementCount ? list : null;
    }

    function renderReminderBlock(block) {
      const wrap = document.createElement("div");
      if (!block) {
        const pending = document.createElement("p");
        pending.className = "reminders-pending";
        pending.textContent = "這一時段還沒有提醒。";
        wrap.appendChild(pending);
        return wrap;
      }
      if (block.headline) {
        const headline = document.createElement("p");
        headline.className = "reminders-headline";
        headline.textContent = block.headline;
        wrap.appendChild(headline);
      }
      if (block.sub) {
        const sub = document.createElement("p");
        sub.className = "reminders-sub";
        sub.textContent = block.sub;
        wrap.appendChild(sub);
      }
      (block.sections || []).forEach((section) => {
        const rows = renderReminderRows(section);
        if (!rows) return;
        const group = document.createElement("section");
        group.className = "reminders-section";
        if (section.label) {
          const label = document.createElement("h4");
          label.textContent = section.label;
          group.appendChild(label);
        }
        group.appendChild(rows);
        wrap.appendChild(group);
      });
      if (Array.isArray(block.notes) && block.notes.length) {
        const notes = document.createElement("div");
        notes.className = "reminders-notes";
        block.notes.forEach((note) => {
          if (!note) return;
          const line = document.createElement("p");
          appendLinkedText(line, note);
          notes.appendChild(line);
        });
        if (notes.childElementCount) wrap.appendChild(notes);
      }
      return wrap;
    }

    const REMINDERS_OPEN_KEY = "link-hub-reminders-open";

    function readReminderOpen(date) {
      try {
        const stored = JSON.parse(localStorage.getItem(REMINDERS_OPEN_KEY) || "null");
        if (!stored || stored.date !== date) return false;
        return stored.open === true;
      } catch (error) {
        return false;
      }
    }

    function writeReminderOpen(date, open) {
      try {
        localStorage.setItem(REMINDERS_OPEN_KEY, JSON.stringify({ date: date, open: !!open }));
      } catch (error) { /* 私密模式就不記住 */ }
    }

    function reminderCard(data) {
      if (!data || typeof data !== "object") return null;
      if (data.card && (data.card.headline || data.card.sections)) {
        return { slot: data.slot || data.card.theme || "morning", block: data.card };
      }
      if (data.evening) return { slot: "evening", block: data.evening };
      if (data.morning) return { slot: "morning", block: data.morning };
      return null;
    }

    function reminderPeek(block) {
      const names = ["今天還沒完成", "今天先做", "今天到期"];
      const sections = (block && block.sections) || [];
      let rows = [];
      for (let i = 0; i < names.length; i += 1) {
        const section = sections.find((entry) => entry && entry.label === names[i]);
        const found = ((section && section.rows) || []).filter((row) => row && row.text && !row.muted);
        if (found.length) {
          rows = found;
          break;
        }
      }
      return {
        items: rows.slice(0, 3),
        extra: Math.max(0, rows.length - 3)
      };
    }

    function renderReminderPeek(block, host) {
      host.replaceChildren();
      const peek = reminderPeek(block);
      if (!peek.items.length) return;
      const list = document.createElement("ul");
      list.className = "reminders-summary";
      peek.items.forEach((row) => {
        const item = document.createElement("li");
        const dot = document.createElement("span");
        dot.className = "reminders-dot";
        if (row.color) dot.style.background = row.color;
        const text = document.createElement("span");
        text.className = "reminders-item";
        text.textContent = row.text;
        item.append(dot, text);
        list.appendChild(item);
      });
      host.appendChild(list);
      if (peek.extra) {
        const more = document.createElement("p");
        more.className = "reminders-more";
        more.textContent = "還有 " + peek.extra + " 件";
        host.appendChild(more);
      }
    }

    function renderRemindersPending(root, dateLabel) {
      const section = document.createElement("section");
      section.className = "day reminders cat-remind is-collapsed is-pending";
      const bar = document.createElement("div");
      bar.className = "reminders-toggle";
      const body = document.createElement("div");
      body.className = "reminders-toggle-body";
      const headline = document.createElement("p");
      headline.className = "reminders-headline";
      headline.textContent = "今日提醒";
      const pending = document.createElement("p");
      pending.className = "reminders-pending";
      pending.textContent = "今天的提醒還沒更新";
      body.append(headline, pending);
      bar.append(badge("icon-remind"), body);
      section.appendChild(bar);
      root.replaceChildren(section);
    }

    function renderReminders(root, data) {
      const today = viewDate();
      const picked = reminderCard(data);
      if (!data || data.date !== today || !picked) {
        const parts = reminderDayParts(today);
        renderRemindersPending(root, parts.md ? parts.md : today);
        return;
      }

      const block = picked.block;
      const section = document.createElement("section");
      section.className = "day reminders cat-remind";

      const parts = reminderDayParts(data.date);
      const mark = document.createElement("div");
      mark.className = "day-mark";
      const dow = document.createElement("span");
      dow.className = "dow";
      dow.textContent = parts.dow;
      const md = document.createElement("span");
      md.className = "md";
      md.textContent = parts.md;
      const year = document.createElement("span");
      year.className = "year";
      year.textContent = parts.year;
      mark.append(dow, md, year);

      const blocks = document.createElement("div");
      blocks.className = "blocks";

      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "reminders-toggle";
      toggle.setAttribute("aria-controls", "reminders-details");

      const toggleBody = document.createElement("div");
      toggleBody.className = "reminders-toggle-body";
      const kicker = document.createElement("p");
      kicker.className = "reminders-kicker";
      kicker.textContent = "今日提醒";
      const headline = document.createElement("p");
      headline.className = "reminders-headline";
      headline.textContent = block.headline || "今日提醒";
      const sub = document.createElement("p");
      sub.className = "reminders-sub";
      if (block.sub) {
        sub.textContent = block.sub;
      } else {
        sub.hidden = true;
      }
      const peekHost = document.createElement("div");
      renderReminderPeek(block, peekHost);
      toggleBody.append(kicker, headline, sub, peekHost);

      const affordance = document.createElement("span");
      affordance.className = "reminders-affordance";
      affordance.setAttribute("aria-hidden", "true");
      toggle.append(badge("icon-remind"), toggleBody, affordance);

      const details = document.createElement("section");
      details.className = "block cat-remind reminders-details";
      details.id = "reminders-details";
      details.appendChild(renderReminderBlock(block));
      if (data.updated_at) {
        const updated = document.createElement("p");
        updated.className = "reminders-updated";
        const stamp = formatUpdatedAt(data.updated_at);
        updated.textContent = stamp ? "更新於 " + stamp : "";
        if (updated.textContent) details.appendChild(updated);
      }

      function setOpen(open) {
        open = !!open;
        section.classList.toggle("is-expanded", open);
        section.classList.toggle("is-collapsed", !open);
        toggle.setAttribute("aria-expanded", open ? "true" : "false");
        toggle.setAttribute("aria-label", open ? "收合今日提醒" : "展開今日提醒");
        details.hidden = !open;
        affordance.textContent = open ? "▴ 收合" : "▾ 展開";
        writeReminderOpen(data.date, open);
      }

      toggle.addEventListener("click", () => {
        setOpen(!section.classList.contains("is-expanded"));
      });

      blocks.append(toggle, details);
      section.append(mark, blocks);
      root.replaceChildren(section);
      setOpen(readReminderOpen(data.date));
    }

    async function loadReminders() {
      const root = document.getElementById("reminders");
      if (!root) return;
      try {
        const response = await fetch("reminders.json?v=" + Date.now(), { cache: "no-store" });
        if (!response.ok) {
          renderRemindersPending(root);
          return;
        }
        const data = await response.json();
        renderReminders(root, data);
      } catch (error) {
        renderRemindersPending(root);
      }
    }

    async function load() {
      const response = await fetch("data.json?v=" + Date.now(), { cache: "no-store" });
      if (!response.ok) throw new Error("無法讀取 data.json");
      const data = await response.json();
      const days = Array.isArray(data.days) ? data.days : [];
      const history = Array.isArray(data.history) ? data.history : [];
      const app = document.getElementById("app");

      if (!days.length && !history.length) {
        showMessage("最近還沒有連結。");
        return;
      }

      renderLegend(data);
      app.className = "";
      app.replaceChildren();
      const recent = renderDays(days, data);
      if (recent.childNodes.length) app.appendChild(recent);

      const older = renderDays(history, data);
      if (older.childNodes.length) {
        const details = document.createElement("details");
        details.className = "history";
        const summary = document.createElement("summary");
        summary.textContent = "歷史";
        details.append(summary, older);
        app.appendChild(details);
      }
    }

    const GATE_SALT = "mv24FYlAQXqzWPt+kNbhdw==";
    const GATE_ITERATIONS = 200000;
    const GATE_HASH = "3xAExdNY8/ArB2V6OVaNLkCIqCfvftk81PIMvdj9sIM=";
    const GATE_KEY = "link-hub-gate";

    function gateBytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i += 1) out[i] = bin.charCodeAt(i);
      return out;
    }

    function remembered() {
      try { return localStorage.getItem(GATE_KEY) === GATE_HASH; }
      catch (error) { return false; }
    }

    function remember() {
      try { localStorage.setItem(GATE_KEY, GATE_HASH); }
      catch (error) { /* 私密模式就每次再問 */ }
    }

    async function passwordMatches(password) {
      const material = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveBits"]
      );
      const bits = await crypto.subtle.deriveBits({
        name: "PBKDF2",
        salt: gateBytes(GATE_SALT),
        iterations: GATE_ITERATIONS,
        hash: "SHA-256"
      }, material, 256);
      const got = new Uint8Array(bits);
      const expected = gateBytes(GATE_HASH);
      if (got.length !== expected.length) return false;
      let diff = 0;
      for (let i = 0; i < got.length; i += 1) diff |= got[i] ^ expected[i];
      return diff === 0;
    }

    function openDesk() {
      document.getElementById("gate").hidden = true;
      document.getElementById("desk").hidden = false;
      loadReminders();
      load().catch(() => showMessage("連結讀取失敗，請稍後再試。"));
    }

    const gateForm = document.getElementById("gate-form");
    gateForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = document.getElementById("gate-password");
      const error = document.getElementById("gate-error");
      const button = gateForm.querySelector("button");
      error.hidden = true;
      button.disabled = true;
      try {
        const ok = await passwordMatches(input.value);
        if (!ok) {
          error.hidden = false;
          input.focus();
          return;
        }
        input.value = "";
        remember();
        openDesk();
      } catch (gateError) {
        error.hidden = false;
      } finally {
        button.disabled = false;
      }
    });

    if (remembered()) openDesk();
  </script>
