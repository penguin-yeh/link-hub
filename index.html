<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="各個 bot 每天交來的連結都整理在這裡。">
  <meta name="robots" content="noindex">
  <title>每日連結總站</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="site.webmanifest">
  <meta name="apple-mobile-web-app-title" content="每日連結總站">
  <meta name="theme-color" content="#1a1815">
  <style>
    :root {
      color-scheme: light;
      --bg: #efe6d8;
      --fg: #1c1915;
      --muted: #6f655b;
      --paper: #fbf7f1;
      --line: #e3d5c2;
      --mast: #1a1815;
      --mast-fg: #f8f2e8;
      --mast-muted: #c9baa6;
      --gold: #e2b15a;
      --serif: "Iowan Old Style", Palatino, "Palatino Linotype", "Songti TC", "Noto Serif TC", "PMingLiU", serif;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #100f0d;
        --fg: #f4efe6;
        --muted: #b7ab9c;
        --paper: #1b1a17;
        --line: #34302a;
        --mast: #070706;
        --mast-fg: #f7f2ea;
        --mast-muted: #b7ab9c;
        --gold: #e2b15a;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      line-height: 1.5;
    }

    .svg-sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .masthead {
      background: var(--mast);
      color: var(--mast-fg);
      padding: 2.8rem 1.25rem 2.2rem;
    }

    .wrap {
      width: min(48rem, 100%);
      margin: 0 auto;
      padding: 0 1.2rem;
    }

    .kicker {
      margin: 0 0 0.7rem;
      color: var(--gold);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.24em;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(2.15rem, 6vw, 3.25rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.12;
    }

    .dek {
      max-width: 34rem;
      margin: 0.85rem 0 0;
      color: var(--mast-muted);
      font-size: 0.98rem;
    }

    main { padding: 1.25rem 0 4rem; }

    .key {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      list-style: none;
      margin: 0 0 1.15rem;
      padding: 0;
    }

    .chip,
    .block-head {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .key li { display: flex; }

    .chip {
      border-radius: 999px;
      padding: 0.22rem 0.72rem 0.22rem 0.22rem;
      background: var(--fill);
      color: var(--ink);
      font-size: 0.82rem;
      font-weight: 700;
    }

    a.chip,
    a.chip:visited {
      color: var(--ink);
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    a.chip:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    a.chip:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    .chip.is-disabled {
      opacity: 0.38;
      cursor: default;
    }

    .carry {
      margin-left: auto;
      padding: 0.12rem 0.5rem;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      color: var(--soft);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    @media (prefers-reduced-motion: reduce) {
      a.chip { transition: none; }
    }

    .mark {
      display: grid;
      place-items: center;
      flex: none;
      background: var(--mark);
      color: var(--mark-ink);
    }

    .mark svg {
      display: block;
      width: 1.15rem;
      height: 1.15rem;
    }

    .chip .mark {
      width: 1.7rem;
      height: 1.7rem;
      border-radius: 999px;
    }

    .chip .mark svg { width: 0.95rem; height: 0.95rem; }

    .day {
      display: grid;
      grid-template-columns: 6.4rem minmax(0, 1fr);
      gap: 0.85rem 1.05rem;
      margin: 0 0 1.15rem;
      padding: 1rem;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 1.35rem;
    }

    .day-mark { padding-top: 0.15rem; }

    .dow {
      display: block;
      font-family: var(--serif);
      font-size: 2.7rem;
      font-weight: 600;
      line-height: 0.85;
      letter-spacing: -0.04em;
    }

    .md {
      display: block;
      margin-top: 0.55rem;
      font-size: 0.95rem;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .year {
      display: block;
      margin-top: 0.1rem;
      color: var(--muted);
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
    }

    .blocks {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      min-width: 0;
    }

    .block {
      background: var(--fill);
      color: var(--ink);
      border-radius: 1rem;
      padding: 0.85rem 0.95rem 0.35rem;
    }

    .block-head { gap: 0.7rem; margin-bottom: 0.45rem; }

    .block .mark {
      width: 3rem;
      height: 3rem;
      border-radius: 0.85rem;
    }

    .block .mark svg { width: 1.6rem; height: 1.6rem; }

    .block h3 {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 750;
      letter-spacing: 0.12em;
    }

    .links {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .links a {
      display: block;
      min-height: 2.75rem;
      padding: 0.65rem 0.15rem 0.7rem;
      border-top: 1px solid var(--hairline);
      color: inherit;
      text-decoration: none;
    }

    .links a:hover .title { text-decoration: underline; text-underline-offset: 0.18em; }

    .links a:focus-visible {
      outline: 2px solid var(--mark);
      outline-offset: 2px;
      border-radius: 0.4rem;
    }

    .title {
      display: block;
      font-size: 1.02rem;
      font-weight: 680;
      overflow-wrap: anywhere;
    }

    .bot {
      display: block;
      margin-top: 0.12rem;
      color: var(--soft);
      font-size: 0.82rem;
    }

    .cat-news {
      --fill: #dce8f8;
      --ink: #16345c;
      --soft: #4c6890;
      --mark: #1d4f92;
      --mark-ink: #f4f8fd;
      --hairline: rgba(29, 79, 146, 0.18);
    }

    .cat-insight {
      --fill: #f8ead0;
      --ink: #6a3d0c;
      --soft: #8d6233;
      --mark: #a15c12;
      --mark-ink: #fff8ee;
      --hairline: rgba(161, 92, 18, 0.2);
    }

    .cat-x {
      --fill: #141414;
      --ink: #f6f6f6;
      --soft: #c6c6c6;
      --mark: #f6f6f6;
      --mark-ink: #111111;
      --hairline: rgba(255, 255, 255, 0.16);
    }

    .cat-tech {
      --fill: #d9f1ea;
      --ink: #0d3f36;
      --soft: #3d6f64;
      --mark: #0e6b5c;
      --mark-ink: #f3fbf8;
      --hairline: rgba(14, 107, 92, 0.18);
    }

    .cat-learn {
      --fill: #e6e1f6;
      --ink: #2f2563;
      --soft: #61589a;
      --mark: #5240a8;
      --mark-ink: #f7f5fe;
      --hairline: rgba(82, 64, 168, 0.18);
    }

    .cat-expense {
      --fill: #f8e7ee;
      --ink: #5a2036;
      --soft: #7d4a5e;
      --mark: #9b2f55;
      --mark-ink: #fff6f8;
      --hairline: rgba(155, 47, 85, 0.2);
    }

    .cat-weekend {
      --fill: #fde3d4;
      --ink: #6e2e16;
      --soft: #945743;
      --mark: #d15a2c;
      --mark-ink: #fff7f3;
      --hairline: rgba(209, 90, 44, 0.2);
    }

    @media (prefers-color-scheme: dark) {
      .cat-news {
        --fill: #1a2c44;
        --ink: #e6eef9;
        --soft: #a9c0de;
        --mark: #8eb7ea;
        --mark-ink: #102033;
        --hairline: rgba(142, 183, 234, 0.28);
      }

      .cat-insight {
        --fill: #332616;
        --ink: #fbe7c6;
        --soft: #e2c59a;
        --mark: #f0c27a;
        --mark-ink: #2a1c0c;
        --hairline: rgba(240, 194, 122, 0.28);
      }

      .cat-x {
        --fill: #f3f3f3;
        --ink: #151515;
        --soft: #4e4e4e;
        --mark: #151515;
        --mark-ink: #f6f6f6;
        --hairline: rgba(0, 0, 0, 0.12);
      }

      .cat-tech {
        --fill: #132924;
        --ink: #def6ef;
        --soft: #a7d5c8;
        --mark: #8ed9c8;
        --mark-ink: #0d2420;
        --hairline: rgba(142, 217, 200, 0.28);
      }

      .cat-learn {
        --fill: #25203f;
        --ink: #e9e5fb;
        --soft: #bdb4e6;
        --mark: #b4a6f2;
        --mark-ink: #1c1736;
        --hairline: rgba(180, 166, 242, 0.28);
      }

      .cat-expense {
        --fill: #3a1c2a;
        --ink: #fde8f0;
        --soft: #e7b4c6;
        --mark: #f0a0c0;
        --mark-ink: #3a1828;
        --hairline: rgba(240, 160, 192, 0.3);
      }

      .cat-weekend {
        --fill: #3a2219;
        --ink: #ffe4d4;
        --soft: #f0c2ae;
        --mark: #ffb089;
        --mark-ink: #3a1c12;
        --hairline: rgba(255, 176, 137, 0.3);
      }
    }

    details.history { margin-top: 0.4rem; }

    summary {
      display: flex;
      align-items: center;
      min-height: 2.9rem;
      padding: 0.7rem 1.05rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      font-weight: 750;
      cursor: pointer;
    }

    summary:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    details.history .day:first-of-type { margin-top: 1rem; }

    .status { color: var(--muted); }

    .gate { margin: 0 auto 1.25rem; max-width: 22rem; }
    .gate[hidden] { display: none; }
    .gate form {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 1.35rem;
      padding: 1.15rem;
    }
    .gate h2 {
      margin: 0 0 0.85rem;
      font-family: var(--serif);
      font-size: 1.35rem;
      font-weight: 600;
    }
    .gate label { display: block; margin-bottom: 0.4rem; font-size: 0.88rem; color: var(--muted); }
    .gate input {
      width: 100%;
      min-height: 2.75rem;
      padding: 0.55rem 0.75rem;
      border: 1px solid var(--line);
      border-radius: 0.7rem;
      background: var(--bg);
      color: var(--fg);
      font: inherit;
    }
    .gate button {
      width: 100%;
      min-height: 2.75rem;
      margin-top: 0.7rem;
      border: 0;
      border-radius: 999px;
      background: var(--mast);
      color: var(--mast-fg);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .gate button:disabled { opacity: 0.6; cursor: default; }
    .gate input:focus-visible,
    .gate button:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }
    .gate-error { margin: 0.7rem 0 0; color: #8d2f2f; min-height: 1.2em; }
    @media (prefers-color-scheme: dark) {
      .gate-error { color: #f0b4b4; }
    }

    .pin {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 0 0 1rem;
      padding: 0.85rem 0.95rem;
      border-radius: 1rem;
      background: var(--fill);
      color: var(--ink);
      text-decoration: none;
    }
    .pin .mark { width: 3rem; height: 3rem; border-radius: 0.85rem; }
    .pin .mark svg { width: 1.6rem; height: 1.6rem; }
    .pin .title { font-weight: 700; color: var(--ink); }
    .pin .bot { color: var(--soft); }
    .pin:hover .title { text-decoration: underline; text-underline-offset: 0.18em; }
    .pin:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }

    @media (max-width: 640px) {
      .masthead { padding: 2.1rem 0 1.6rem; }

      .day {
        grid-template-columns: 1fr;
        gap: 0.75rem;
        padding: 0.85rem;
      }

      .day-mark {
        display: flex;
        align-items: baseline;
        gap: 0.65rem;
        padding-bottom: 0.45rem;
        border-bottom: 1px solid var(--line);
      }

      .dow { font-size: 1.85rem; }
      .md { margin-top: 0; }
      .year { margin-left: auto; }
    }
  </style>
</head>
<body>
  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-news" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M3.6 4.6h12.2c.7 0 1.2.5 1.2 1.2V19.2H6.2A2.6 2.6 0 0 1 3.6 16.6V4.6Z"/>
      <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6.2 7.6h7.6"/>
      <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M6.2 10.6h3.2M6.2 13h3.2M6.2 15.4h3.2M10.6 10.6h3.2M10.6 13h3.2M10.6 15.4h3.2"/>
      <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M17 7.4h2.6c.6 0 1.1.5 1.1 1.1v8.2a2.5 2.5 0 0 1-2.5 2.5"/>

    </symbol>
    <symbol id="icon-tech" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M4 19.4h16"/>

      <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M14.7 5.6h4.8v4.6"/>
    </symbol>
    <symbol id="icon-learn" viewBox="0 0 24 24">
      <rect x="5" y="3.6" width="14" height="16.8" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="m8.6 9.2 1.3 1.3 2.1-2.4M14 9.5h2.6M8.6 14.2l1.3 1.3 2.1-2.4M14 14.5h2.6"/>

  <header class="masthead">
    <div class="wrap">
      <p class="kicker">LINK DESK</p>
      <h1>每日連結總站</h1>
      <p class="dek">各個 bot 每天交來的連結都整理在這裡，最新的一天在最上面，依類別分組。</p>
    </div>
  </header>
  <main>
    <div class="wrap">
      <section id="gate" class="gate">
        <form id="gate-form">
          <h2>輸入密碼</h2>
          <label for="gate-password">密碼</label>
          <input id="gate-password" type="password" name="password" autocomplete="current-password" required>
          <button type="submit">進入</button>
          <p id="gate-error" class="gate-error" hidden>密碼不對</p>
        </form>
      </section>
      <div id="desk" hidden>
        <a class="pin cat-expense" href="https://penguin-yeh.github.io/expense-dashboard/" rel="noopener noreferrer">
          <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><use href="#icon-expense"></use></svg></span>
          <span>
            <span class="title">消費儀表板</span>
            <span class="bot">記帳小幫手</span>
          </span>
        </a>
        <ul class="key" id="key" hidden></ul>
        <div id="app" class="status">載入中…</div>
      </div>
    </div>
  </main>
  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";
    const CATEGORIES = [
      { name: "新聞", className: "cat-news", icon: "icon-news" },
      { name: "洞察", className: "cat-insight", icon: "icon-insight" },
      { name: "X", className: "cat-x", icon: "icon-x" },
      { name: "學習", className: "cat-learn", icon: "icon-learn" },
      { name: "記帳", className: "cat-expense", icon: "icon-expense" },
      { name: "週末", className: "cat-weekend", icon: "icon-weekend" }
    ];

    function icon(id) {
      const svg = document.createElementNS(SVG_NS, "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("aria-hidden", "true");
      svg.setAttribute("focusable", "false");
      const use = document.createElementNS(SVG_NS, "use");
      use.setAttribute("href", "#" + id);
      svg.appendChild(use);
      return svg;
    }

    function badge(id) {
      const mark = document.createElement("span");
      mark.className = "mark";
      mark.appendChild(icon(id));
      return mark;
    }

    function byDateDesc(a, b) {
      return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
    }

    function safeHref(href) {
      try {
        const url = new URL(href, window.location.href);
        if (url.protocol === "http:" || url.protocol === "https:") return url.href;
      } catch (error) {
        return null;
      }
      return null;
    }

    function dayParts(day) {
      const label = day.label || day.date || "";
      const match = /^(\d{4})-(\d{2})-(\d{2})（(.)）$/.exec(label);
      if (!match) return { dow: "", md: label, year: "" };
      return { dow: match[4], md: match[2] + "/" + match[3], year: match[1] };
    }

    function utcWeekday(iso) {
      const parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
      if (!parts) return null;
      return new Date(Date.UTC(Number(parts[1]), Number(parts[2]) - 1, Number(parts[3]))).getUTCDay();
    }

    function shiftDate(iso, days) {
      const parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
      const dt = new Date(Date.UTC(Number(parts[1]), Number(parts[2]) - 1, Number(parts[3])));
      dt.setUTCDate(dt.getUTCDate() + days);
      const month = String(dt.getUTCMonth() + 1).padStart(2, "0");
      const day = String(dt.getUTCDate()).padStart(2, "0");
      return dt.getUTCFullYear() + "-" + month + "-" + day;
    }

    function latestHref(data, categoryName) {
      const pools = [data.days || [], data.history || []];
      for (let i = 0; i < pools.length; i += 1) {
        const sorted = pools[i].slice().sort(byDateDesc);
        for (let j = 0; j < sorted.length; j += 1) {
          const item = (sorted[j].items || []).find((entry) => entry.category === categoryName);
          if (!item) continue;
          const href = safeHref(item.href);
          if (href) return href;
        }
      }
      return null;
    }

    function isoDate(year, month, day) {
      return year + "-" + String(month).padStart(2, "0") + "-" + String(day).padStart(2, "0");
    }

    function isRealDate(iso) {
      const parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
      if (!parts) return false;
      const dt = new Date(Date.UTC(Number(parts[1]), Number(parts[2]) - 1, Number(parts[3])));
      return dt.getUTCFullYear() === Number(parts[1])
        && dt.getUTCMonth() === Number(parts[2]) - 1
        && dt.getUTCDate() === Number(parts[3]);
    }

    function targetSaturday(item, arrivalDate) {
      const fromHref = String(item.href || "").match(/(\d{4}-\d{2}-\d{2})\.html/);
      if (fromHref && isRealDate(fromHref[1])) return fromHref[1];
      const fromTitle = String(item.title || "").match(/(\d{1,2})\s*[\/／]\s*(\d{1,2})/);
      if (!fromTitle) return null;
      const month = Number(fromTitle[1]);
      const day = Number(fromTitle[2]);
      let year = arrivalDate ? Number(String(arrivalDate).slice(0, 4)) : Number(taipeiToday().slice(0, 4));
      let iso = isoDate(year, month, day);
      if (!isRealDate(iso)) return null;
      if (arrivalDate && iso < arrivalDate) iso = isoDate(year + 1, month, day);
      return isRealDate(iso) ? iso : null;
    }

    function weekSaturday(iso) {
      const delta = { 4: 2, 5: 1, 6: 0, 0: -1 }[utcWeekday(iso)];
      if (delta === undefined) return null;
      return shiftDate(iso, delta);
    }

    function taipeiToday() {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Taipei",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date());
    }

    function currentWeekendSaturday(today) {
      const weekday = utcWeekday(today);
      if (weekday === 0) return shiftDate(today, -1);
      return shiftDate(today, 6 - weekday);
    }

    function weekendEntries(data) {
      const entries = [];
      (data.days || []).concat(data.history || []).forEach((day) => {
        (day.items || []).forEach((item) => {
          if (item.category !== "週末") return;
          entries.push({
            date: day.date || "",
            item: item,
            target: targetSaturday(item, day.date)
          });
        });
      });
      return entries;
    }

    function byArrivalDesc(a, b) {
      return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
    }

    // 四到日顯示「該週六」對應的週末推薦，取代當天為更晚週末交來的那一筆。
    function weekendForDay(day, entries) {
      const own = (day.items || []).filter((item) => item.category === "週末");
      const saturday = day.date ? weekSaturday(day.date) : null;
      if (!saturday) return { items: own, tagged: false };
      const matches = entries.filter((entry) => entry.target === saturday).sort(byArrivalDesc);
      if (!matches.length) return { items: [], tagged: false };
      return { items: [matches[0].item], tagged: true };
    }

    function weekendChipHref(data) {
      const entries = weekendEntries(data).filter((entry) => safeHref(entry.item.href));
      if (!entries.length) return null;
      const saturday = currentWeekendSaturday(taipeiToday());
      const exact = entries.filter((entry) => entry.target === saturday).sort(byArrivalDesc);
      if (exact.length) return safeHref(exact[0].item.href);
      const future = entries
        .filter((entry) => entry.target && entry.target > saturday)
        .sort((a, b) => (a.target < b.target ? -1 : a.target > b.target ? 1 : byArrivalDesc(a, b)));
      if (future.length) return safeHref(future[0].item.href);
      return safeHref(entries.slice().sort(byArrivalDesc)[0].item.href);
    }

    function renderLegend(data) {
      const list = document.getElementById("key");
      list.replaceChildren();
      CATEGORIES.forEach((category) => {
        const li = document.createElement("li");
        const href = category.name === "週末" ? weekendChipHref(data) : latestHref(data, category.name);
        const chip = document.createElement(href ? "a" : "span");
        chip.className = "chip " + category.className + (href ? "" : " is-disabled");
        if (href) {
          chip.href = href;
          chip.target = "_blank";
          chip.rel = "noopener noreferrer";
          chip.setAttribute("aria-label", "開啟最新的" + category.name);
        } else {
          chip.setAttribute("aria-disabled", "true");
        }
        const name = document.createElement("span");
        name.textContent = category.name;
        chip.append(badge(category.icon), name);
        li.appendChild(chip);
        list.appendChild(li);
      });
      list.hidden = false;
    }

    function renderDay(day, sources) {
      const section = document.createElement("section");
      section.className = "day";

      const parts = dayParts(day);
      const mark = document.createElement("div");
      mark.className = "day-mark";
      if (parts.dow) {
        const dow = document.createElement("span");
        dow.className = "dow";
        dow.textContent = parts.dow;
        const md = document.createElement("span");
        md.className = "md";
        md.textContent = parts.md;
        const year = document.createElement("span");
        year.className = "year";
        year.textContent = parts.year;
        mark.append(dow, md, year);
      } else {
        mark.textContent = day.label || day.date || "";
      }
      section.appendChild(mark);

      const blocks = document.createElement("div");
      blocks.className = "blocks";

      CATEGORIES.forEach((category) => {
        let items = (day.items || []).filter((item) => item.category === category.name);
        let carried = false;
        if (category.name === "週末") {
          const picked = weekendForDay(day, sources);
          items = picked.items;
          carried = picked.tagged;
        }
        if (!items.length) return;

        const block = document.createElement("section");
        block.className = "block " + category.className;

        const head = document.createElement("div");
        head.className = "block-head";
        const title = document.createElement("h3");
        title.textContent = category.name;
        head.append(badge(category.icon), title);
        if (carried) {
          const tag = document.createElement("span");
          tag.className = "carry";
          tag.textContent = "本週末";
          head.appendChild(tag);
        }
        block.appendChild(head);

        const list = document.createElement("ul");
        list.className = "links";
        items.forEach((item) => {
          const href = safeHref(item.href);
          if (!href) return;
          const li = document.createElement("li");
          const link = document.createElement("a");
          link.href = href;
          link.target = "_blank";
          link.rel = "noopener noreferrer";

          const name = document.createElement("span");
          name.className = "title";
          name.textContent = item.title || href;

          const bot = document.createElement("span");
          bot.className = "bot";
          bot.textContent = item.bot || "";

          link.append(name, bot);
          li.appendChild(link);
          list.appendChild(li);
        });

        if (!list.childElementCount) return;
        block.appendChild(list);
        blocks.appendChild(block);
      });

      section.appendChild(blocks);
      return section;
    }

    function renderDays(days, data) {
      const sources = weekendEntries(data);
      const fragment = document.createDocumentFragment();
      days.slice().sort(byDateDesc).forEach((day) => {
        fragment.appendChild(renderDay(day, sources));
      });
      return fragment;
    }

    function showMessage(text) {
      const app = document.getElementById("app");
      app.className = "status";
      app.textContent = text;
    }

    async function load() {
      const response = await fetch("data.json?v=" + Date.now(), { cache: "no-store" });
      if (!response.ok) throw new Error("無法讀取 data.json");
      const data = await response.json();
      const days = Array.isArray(data.days) ? data.days : [];
      const history = Array.isArray(data.history) ? data.history : [];
      const app = document.getElementById("app");

      if (!days.length && !history.length) {
        showMessage("最近還沒有連結。");
        return;
      }

      renderLegend(data);
      app.className = "";
      app.replaceChildren();
      if (days.length) app.appendChild(renderDays(days, data));

      if (history.length) {
        const details = document.createElement("details");
        details.className = "history";
        const summary = document.createElement("summary");
        summary.textContent = "歷史";
        details.append(summary, renderDays(history, data));
        app.appendChild(details);
      }
    }

    const GATE_SALT = "mv24FYlAQXqzWPt+kNbhdw==";
    const GATE_ITERATIONS = 200000;
    const GATE_HASH = "3xAExdNY8/ArB2V6OVaNLkCIqCfvftk81PIMvdj9sIM=";
    const GATE_KEY = "link-hub-gate";

    function gateBytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i += 1) out[i] = bin.charCodeAt(i);
      return out;
    }

    function remembered() {
      try { return localStorage.getItem(GATE_KEY) === GATE_HASH; }
      catch (error) { return false; }
    }

    function remember() {
      try { localStorage.setItem(GATE_KEY, GATE_HASH); }
      catch (error) { /* 私密模式就每次再問 */ }
    }

    async function passwordMatches(password) {
      const material = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveBits"]
      );
      const bits = await crypto.subtle.deriveBits({
        name: "PBKDF2",
        salt: gateBytes(GATE_SALT),
        iterations: GATE_ITERATIONS,
        hash: "SHA-256"
      }, material, 256);
      const got = new Uint8Array(bits);
      const expected = gateBytes(GATE_HASH);
      if (got.length !== expected.length) return false;
      let diff = 0;
      for (let i = 0; i < got.length; i += 1) diff |= got[i] ^ expected[i];
      return diff === 0;
    }

    function openDesk() {
      document.getElementById("gate").hidden = true;
      document.getElementById("desk").hidden = false;
      load().catch(() => showMessage("連結讀取失敗，請稍後再試。"));
    }

    const gateForm = document.getElementById("gate-form");
    gateForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = document.getElementById("gate-password");
      const error = document.getElementById("gate-error");
      const button = gateForm.querySelector("button");
      error.hidden = true;
      button.disabled = true;
      try {
        const ok = await passwordMatches(input.value);
        if (!ok) {
          error.hidden = false;
          input.focus();
          return;
        }
        input.value = "";
        remember();
        openDesk();
      } catch (gateError) {
        error.hidden = false;
      } finally {
        button.disabled = false;
      }
    });

    if (remembered()) openDesk();
  </script>
</body>
